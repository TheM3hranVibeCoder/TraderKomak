# Render blueprint for the persistent market-server.
# The web frontend deploys to Vercel (vercel.json); this service hosts the
# OANDA/Binance streams, candle aggregation, and the WebSocket hub.
services:
  - type: web
    name: traderkomak-market-server
    runtime: node
    plan: free
    region: frankfurt
    # npm install --include=dev: Render's default install can skip
    # devDependencies (@types/node, typescript) — force them in so tsc compiles.
    buildCommand: npm install --include=dev && npm run build:shared && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Secrets — set these in the Render dashboard (sync: false):
      - key: OANDA_API_TOKEN
        sync: false
      - key: OANDA_ACCOUNT_ID
        sync: false
      # Comma-separated list of allowed frontend origins (your Vercel URL).
      # Use * only for testing.
      - key: CORS_ORIGIN
        sync: false
      # Optional overrides — defaults match apps/market-server/src/config/env.ts
      - key: OANDA_API_URL
        value: https://api-fxpractice.oanda.com
      - key: OANDA_STREAM_URL
        value: https://stream-fxpractice.oanda.com
      # ── Lean mode: candles come from each visitor's OWN internet (browser →
      # Binance vision endpoints + browser → OANDA practice pool in
      # apps/web/src/services/oandaAccounts.ts, with oanda.traderkomak.ir as
      # fallback). Render only serves chat (/chat), admin, health and rare
      # REST fallbacks (Dukascopy symbols, geo-blocked visitors). Keep this
      # EMPTY so no aggregation/stream runs with zero subscribers.
      - key: PERSISTENT_AGGREGATIONS
        value: ""
      - key: LOG_LEVEL
        value: info
      # Secrets — set these in the Render dashboard (sync: false):
      - key: CHAT_ADMIN_KEY
        sync: false
      # Optional: matches cloudflare-worker/edge's EDGE_SHARED_SECRET
      # (X-Tk-Edge-Auth hardening — see apps/market-server/src/util/clientIp.ts)
      - key: EDGE_SHARED_SECRET
        sync: false
      # ── cTrader (US30) — optional; setup: deploy/ctrader-setup.md. Empty =
      # cTrader disabled, server runs exactly as before. Tokens auto-refresh;
      # the numeric account id is discovered from the token when omitted.
      - key: CTRADER_CLIENT_ID
        sync: false
      - key: CTRADER_CLIENT_SECRET
        sync: false
      - key: CTRADER_ACCOUNT_ID
        sync: false
      - key: CTRADER_ACCESS_TOKEN
        sync: false
      - key: CTRADER_REFRESH_TOKEN
        sync: false
      - key: CHAT_OWNER_NICK
        value: mehran
