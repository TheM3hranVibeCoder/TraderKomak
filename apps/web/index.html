<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply the saved theme BEFORE first paint — otherwise the CSS dark
         default flashes black for light-theme users on every refresh. New
         visitors get the store's light default here too, so a first-time
         sign-in never paints a black chart while Vue boots. -->
    <script>
      try {
        var t = localStorage.getItem("tk-theme");
        document.documentElement.setAttribute("data-theme", t === "dark" || t === "light" ? t : "light");
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TraderKomak — Live Forex & Crypto Charts and Analysis</title>
    <meta name="description" content="Free real-time forex & crypto charts with market session indicators, demo trading, replay mode and a live community chat — built for traders." />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#2962ff" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Warm up the connections the app actually uses: the market relay
         (WebSocket + REST — the first TLS handshake through the flaky path
         is the slowest part of a cold load), the icon/data CDNs, and
         Supabase. -->
    <link rel="preconnect" href="https://edge.traderkomak.ir" crossorigin />
    <link rel="preconnect" href="https://hfamizhujmalwiumsfet.supabase.co" crossorigin />
    <link rel="preconnect" href="https://flagcdn.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://assets.coincap.io" />
    <!-- Social previews (absolute URLs, 1200×630 share image) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TraderKomak" />
    <meta property="og:url" content="https://www.traderkomak.ir/" />
    <meta property="og:title" content="TraderKomak — Live Forex & Crypto Charts and Analysis" />
    <meta property="og:description" content="Real-time OANDA & Binance charts with market session indicators, demo trading, replay mode and a live community chat — built for traders." />
    <meta property="og:image" content="https://www.traderkomak.ir/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TraderKomak — live forex and crypto charting platform" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TraderKomak — Live Forex & Crypto Charts and Analysis" />
    <meta name="twitter:description" content="Real-time OANDA & Binance charts with market session indicators, demo trading, replay mode and a live community chat — built for traders." />
    <meta name="twitter:image" content="https://www.traderkomak.ir/og-image.png" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "TraderKomak",
      "url": "https://www.traderkomak.ir/",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "description": "Real-time forex and crypto charting platform with market session indicators, demo trading and community chat.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
  </head>
  <body>
    <div id="app">
      <!-- Static pre-hydration shell: crawlers and no-JS visitors get the
           real landmarks/content; Vue 3 replaces it when the app mounts.
           Visually hidden so returning users never see a content flash. -->
      <div id="seo-shell" style="display:none">
      <header>
        <span>TraderKomak</span>
      </header>
      <nav aria-label="Primary">
        <a href="https://t.me/TraderKomak_ir" rel="noopener">Telegram channel</a>
      </nav>
      <main>
        <h1>TraderKomak — Live Forex &amp; Crypto Charts and Analysis</h1>
        <p>Free real-time forex &amp; crypto charts with market session indicators, demo trading, replay mode and a live community chat — sign in with Google to start.</p>
        <nav aria-label="Quick links">
          <a href="https://t.me/TraderKomak_ir" rel="noopener">Join our Telegram channel</a>
        </nav>
      </main>
      </div>
    </div>
    <style>
      /* Pre-hydration only. The shell is display:none (SEO/a11y DOM only);
         the body background follows the saved theme so there is no flash. */
      body { margin: 0; background: linear-gradient(160deg, #0a1020 0%, #0d1220 45%, #120e26 100%); }
      [data-theme="light"] body { background: linear-gradient(160deg, #f2f6ff 0%, #e9efff 45%, #f4effe 100%); }
      #app > header, #app > main, #app > nav { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      #app > header { padding: 14px 20px; font-weight: 800; color: #171c2b; }
      #app > nav { padding: 0 20px 8px; }
      #app > nav a { color: #3b82f6; font-size: 13px; }
      #app > main { max-width: 640px; margin: 8vh auto 0; padding: 0 20px; text-align: center; color: #1f2430; }
      #app > main h1 { font-size: 30px; margin: 0 0 10px; }
      #app > main p { font-size: 15px; line-height: 1.6; color: #5a6378; }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
